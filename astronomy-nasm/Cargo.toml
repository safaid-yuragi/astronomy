[package]
name = "astronomy-nasm"
version = "0.1.0"
edition = "2021"
description = "Out-of-tree NASM (x86-64 System V) native backend for Astronomy IR"
license = "MIT OR Apache-2.0"
readme = "README.md"

# Backends depend only on the core IR; this crate has no external
# dependencies of its own (it emits NASM text and nothing else).
[dependencies]
astronomy = { path = ".." }

[lib]
name = "astronomy_nasm"
path = "src/lib.rs"

[[bin]]
name = "arn2nasm"
path = "src/bin/arn2nasm.rs"
